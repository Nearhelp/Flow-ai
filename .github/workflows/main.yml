name: Satik Soch Auto Pipeline

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Step 1 - Gemini Shayari & Prompt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node file1_gemini.js

      - name: Step 2 - Google Flow Image & Download
        env:
          FLOW_COOKIES: ${{ secrets.FLOW_COOKIES }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" node file2_flow.js

      - name: Step 3 - Facebook Page Auto Upload
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: node file3_facebook.js
